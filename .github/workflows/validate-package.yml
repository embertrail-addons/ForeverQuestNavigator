name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fqn-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Test addon
        run: lua5.1 tests/run.lua
      - name: Replay regression fixtures
        run: |
          for fixture in tests/fixtures/*.json; do
            python scripts/replay.py "$fixture"
          done
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate release metadata and translations
        env:
          BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$BUILD_TAG" ]; then
            python3 scripts/check_release.py --tag "$BUILD_TAG"
          else
            python3 scripts/check_release.py
          fi
      - name: Build installable ZIP
        env:
          BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$BUILD_TAG" ]; then
            python3 scripts/package.py --tag "$BUILD_TAG"
          else
            python3 scripts/package.py --channel beta
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ForeverQuestNavigator-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Check CurseForge configuration (no upload)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'embertrail-addons/ForeverQuestNavigator'
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python3 scripts/curseforge_upload.py --check-only
      - name: Upload tagged version to CurseForge
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'embertrail-addons/ForeverQuestNavigator'
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/curseforge_upload.py --tag "$RELEASE_TAG"
