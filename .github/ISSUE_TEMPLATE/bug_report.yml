name: Bug report
description: Report a reproducible FQN problem
title: "[Bug]: "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: FQN and game versions
      placeholder: "FQN 0.1.68, Forever 1.60.1"
    validations:
      required: true
  - type: input
    id: quest
    attributes:
      label: Quest ID and name (if relevant)
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether demo mode, Questie or other map addons were enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic information or screenshot
      description: Paste /fqn problem output and a Lua error if available. Add /fqn markers for map issues. Review screenshots and copied reports for personal information before posting. If Questie is not loaded, include /fqn status and the message next to Questie in the game's addon list.
