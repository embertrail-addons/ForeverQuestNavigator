name: Bug report
description: Report a reproducible FQN problem
title: "[Bug]: "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: FQN and game versions
      placeholder: "FQN 0.1.66, Forever 1.60.1"
    validations:
      required: true
  - type: input
    id: quest
    attributes:
      label: Quest ID and name (if relevant)
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether demo mode, Questie or other map addons were enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic information or screenshot
      description: Paste the relevant /fqn debug or /fqn markers output. Include a Lua error if available. Review screenshots and copied reports for personal information before posting.
